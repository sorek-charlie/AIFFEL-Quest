<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이성진 · 클라우드 비밀번호 재설정</title><link rel="stylesheet" href="/recovery.css"><script type="module" src="/recovery.mjs"></script></head><body><main><h1>클라우드 비밀번호 재설정</h1><p>Supabase 앱 사용자 비밀번호를 변경합니다. PC 앱 로그인 비밀번호와는 별개입니다.</p><p id="status" role="status" aria-live="polite">재설정 링크를 확인하고 있습니다.</p><form hidden><label>새 비밀번호<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>새 비밀번호 확인<input name="confirmation" type="password" minlength="8" autocomplete="new-password" required></label><button>새 비밀번호 저장</button></form><p>비밀번호와 메일 링크를 채팅에 보내지 마세요. 완료 후 이 창을 닫고 앱의 클라우드 로그인에 새 비밀번호를 입력하세요.</p></main></body></html>
