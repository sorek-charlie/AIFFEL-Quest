<!doctype html><html lang="ko"><meta charset="utf-8"><title>청구기한·소멸시효</title><style>body{font:16px/1.8 sans-serif;color:#17324d;max-width:960px;margin:36px auto;padding:20px}a{color:#205ad3}</style><h1>청구기한·소멸시효</h1><p>통상 경정청구와 후발적 사유에 따른 청구는 기한과 요건이 다릅니다. 해당 신고의 법정신고기한, 결정·경정 내역과 귀속연도 당시 법령을 기준으로 확인하세요.</p><section id="sources"><h2>공식 확인 경로</h2><ul><li><a href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터</a></li><li><a href="https://www.nts.go.kr/" target="_blank" rel="noopener">국세청</a></li><li><a href="https://www.hometax.go.kr/" target="_blank" rel="noopener">홈택스</a></li></ul></section></html>
