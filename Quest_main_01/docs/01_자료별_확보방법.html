<!doctype html><html lang="ko"><meta charset="utf-8"><title>자료별 확보 방법</title><style>body{font:16px/1.8 sans-serif;color:#17324d;max-width:960px;margin:36px auto;padding:20px}a{color:#205ad3}</style><h1>자료별 확보 방법</h1><p>홈택스에서 법인세 신고서·부속명세·납부·환급 내역을, 근로복지공단과 보험기관에서 고용세액공제용 근로자·사업주 보험료 자료를 발급받습니다. 인증서 암호는 공식기관 인증창에서 입력하세요.</p><section id="sources"><h2>공식 확인 경로</h2><ul><li><a href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터</a></li><li><a href="https://www.nts.go.kr/" target="_blank" rel="noopener">국세청</a></li><li><a href="https://www.hometax.go.kr/" target="_blank" rel="noopener">홈택스</a></li></ul></section></html>
