<!doctype html><html lang="ko"><meta charset="utf-8"><title>연도별 적용 검토</title><style>body{font:16px/1.8 sans-serif;color:#17324d;max-width:960px;margin:36px auto;padding:20px}a{color:#205ad3}</style><h1>연도별 적용 검토</h1><p>2021~2025년 귀속을 연도별로 구분하여 세액공제·감면, 기공제·이월, 최저한세, 추징 및 농특세를 검토합니다. 표시 금액은 검토용 시뮬레이션이며 적용요건·중복배제·실제 납부를 대조해야 합니다.</p><section id="sources"><h2>공식 확인 경로</h2><ul><li><a href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터</a></li><li><a href="https://www.nts.go.kr/" target="_blank" rel="noopener">국세청</a></li><li><a href="https://www.hometax.go.kr/" target="_blank" rel="noopener">홈택스</a></li></ul></section></html>
